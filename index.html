Bapuji Jatiya Vidyalaya is located at Bhawraguri, in the Bijni area of Chirang district, Assam. Established on 2 October 2019, the school aims to provide a supportive learning environment where students can develop knowledge, confidence, discipline and good values.বাপুজী জাতীয় বিদ্যালয় অসমৰ চিৰাং জিলাৰ বিজনী অঞ্চলৰ ভাওঁৰাগুৰীত অৱস্থিত। ২ অক্টোবৰ ২০১৯ তাৰিখে প্ৰতিষ্ঠা হোৱা বিদ্যালয়খনৰ লক্ষ্য হৈছে ছাত্ৰ-ছাত্ৰীসকলক জ্ঞান, আত্মবিশ্বাস, অনুশাসন আৰু সুস্থ মূল্যবোধ গঢ়ি তুলিবলৈ এক সহায়ক শিক্ষাৰ পৰিৱেশ প্ৰদান কৰা।
